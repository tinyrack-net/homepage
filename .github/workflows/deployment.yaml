name: Web Deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: web-deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      # Pushes to main and manual runs on main deploy; pull requests only test.
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.10.0

      - name: Use Node.js 26.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Use fixture articles
        run: pnpm run content:fixtures

      - name: Run test suite
        run: pnpm run test:ci

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore Outline attachment cache
        if: env.DEPLOY == 'true'
        uses: actions/cache@v6.1.0
        with:
          path: .outline-cache
          key: outline-attachments-${{ github.run_id }}
          restore-keys: outline-attachments-

      - name: Pull articles from Outline
        if: env.DEPLOY == 'true'
        run: pnpm run content:pull
        env:
          OUTLINE_API_KEY: ${{ secrets.OUTLINE_API_KEY }}

      - name: Build web with Outline articles
        if: env.DEPLOY == 'true'
        run: pnpm run build

      - name: Deploy to Cloudflare
        if: env.DEPLOY == 'true'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
